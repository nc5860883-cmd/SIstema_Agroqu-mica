# docker-compose.yml
# Orquesta tres contenedores: MySQL, phpMyAdmin y el entorno de Django para SistemaAgroquimica.

services:

  # ---------- Servicio 1: Base de datos MySQL ----------
  db:
    image: mysql:8.0
    container_name: agroquimica_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Servicio 2: phpMyAdmin (administrador web de MySQL) ----------
  phpmyadmin:
    image: phpmyadmin:5
    container_name: agroquimica_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - db

  # ---------- Servicio 3: Entorno de Django (Python) ----------
  web:
    image: python:3.11
    container_name: agroquimica_web
    restart: always
    working_dir: /opt/app
    volumes:
      - .:/opt/app
    ports:
      - "8000:8000"
    environment:
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_HOST: db
      DB_PORT: 3306
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: